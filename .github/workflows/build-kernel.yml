name: build-kernel

on:
  push:
  workflow_dispatch:

env:
  # Under the workspace so no root-owned paths are needed on hosted runners
  KERNEL_SOURCE_DIR: /home/runner/work/kernel-src/husky-kernel

jobs:
  kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          # kleaf gs-6.1 builds need far more than the default free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
                      /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          df -h /

      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Compute package version from branch
        id: pkgver
        run: |
          set -euo pipefail
          version="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build kernel in Docker
        env:
          IMAGE_TAG: lineage-kernel-husky-builder:ci
          REPO_SYNC_JOBS: "4"
          BUILD_JOBS: "4"
        run: ./scripts/run-docker-build.sh

      - name: Show build outputs
        run: |
          set -euo pipefail
          dist_dir="${KERNEL_SOURCE_DIR}/out/shusky/dist"
          if [ ! -d "${dist_dir}" ]; then
            echo "Expected output directory not found: ${dist_dir}" >&2
            exit 1
          fi
          find "${dist_dir}" -maxdepth 1 -type f | sort

      - name: Build kernel.zip
        id: kernelzip
        run: |
          set -euo pipefail
          dist_dir="${KERNEL_SOURCE_DIR}/out/shusky/dist"
          zip_path="${dist_dir}/kernel.zip"
          rm -f "${zip_path}"
          shopt -s nullglob
          files=("${dist_dir}"/*.img "${dist_dir}/Image.lz4")
          existing=()
          for f in "${files[@]}"; do
            [ -f "${f}" ] && existing+=("${f}")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "No kernel images found under ${dist_dir}" >&2
            exit 1
          fi
          (cd "${dist_dir}" && zip -1 -j "${zip_path}" "${existing[@]}")
          echo "path=${zip_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload kernel.zip to this repo's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.pkgver.outputs.version }}
          PKG_FILE: ${{ steps.kernelzip.outputs.path }}
        run: |
          set -euo pipefail
          # Rolling per-branch release in THIS repo; the device CI resolves
          # kernel.zip from <owner>/lineage-kernel-manifest-husky/releases/download
          # with fallback to the "main" release.
          if ! gh release view "${PKG_VERSION}" >/dev/null 2>&1; then
            gh release create "${PKG_VERSION}" \
              --title "Kernel package (${PKG_VERSION})" \
              --notes "kernel.zip for branch \`${PKG_VERSION}\` (commit ${{ github.sha }})." \
              --latest=false
          fi
          gh release upload "${PKG_VERSION}" "${PKG_FILE}#kernel.zip" --clobber
